[pytest]
# Hardware-free unit + integration tests for the `project` (Traffic Signs) task.
# These run the REAL perception/decision/motor code with fake camera/wheels/LEDs
# and synthetic frames (real AprilTags, painted red lines, light blobs) — no
# Duckiebot and no Godot. Run them with the Python 3.11 venv (pupil_apriltags
# only installs there):
#
#   .venv311\Scripts\python.exe -m pytest -q
#
# A bare `pytest` from the repo root collects only the project task tests below;
# point pytest at another path explicitly to run other tasks' tests.
testpaths = tasks/project/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra
markers =
    integration: drives the real agent.main loop end-to-end against fakes
filterwarnings =
    ignore::DeprecationWarning
