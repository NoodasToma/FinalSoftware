approach_creep_speed: 0.25
base_speed: 0.25
light_arm_distance_m: 1.5
light_wait_timeout_s: 12
line_straight_distance_m: 0.6
obstacle_clear_grace_s: 1.0
# Run the duckie obstacle detector (decoupled background thread). true here so the
# sim exercises the same SOFT_STOP path as the bot; set false to disable braking
# for duckies. Other-bot soft-stop (Vehicle AprilTag) is independent of this flag.
object_detection: true
ramp_max_step: 0.05
sign_cooldown: 4
sign_react_distance_m: 1.5
stop_commit_distance_m: 0.3
stop_commit_grace_s: 1
stop_distance_m: 0.25
stop_wait_seconds: 1.5
straight_seconds: 2.2
straight_speed: 0.3
straight_ticks: 777
turn_inner_speed: 0.05
turn_left_inner_speed: 0.39
turn_left_outer_speed: 0.45
turn_left_ticks: 850
turn_outer_speed: 0.45
turn_right_inner_speed: 0.36
turn_right_outer_speed: 0.45
turn_right_ticks: 530
turn_seconds: 0.45
turn_ticks: 118
# After a turn's arc, drive straight this many outer-wheel ticks to clear the
# intersection box and land on the outgoing lane's real markings BEFORE the lane
# PD resumes (inside the box there are no clean markings, so the PD otherwise
# chases a stray edge and unwinds the turn -> the bot drifts off-lane). ~675
# ticks/m, so 300 ~= 0.44 m. Set 0 to disable. turn_exit_seconds is the
# encoderless time fallback.
turn_exit_ticks: 300
turn_exit_seconds: 0.8
